---
# The Technitium container was previously started with `docker run`. There
# was no compose file, so there is nothing to copy and nothing to move: the
# data binds are absolute paths under /opt/technitium/ and they stay exactly
# where they are.
#
# What DOES have to happen is the NAME. The legacy container is holding the
# name `technitium-dns`, and Compose refuses to create a container with a name
# that is already in use:
#
#   Error response from daemon: Conflict. The container name
#   "/technitium-dns" is already in use by container "bfee33da...".
#
# So the legacy container is stopped and REMOVED, which frees the name for the
# compose project to take. The DATA is untouched - it lives in the bind mounts,
# not in the container - so removing the container loses nothing.
#
# This hook is idempotent: if the legacy container is already gone, there is
# nothing to remove and the run is a no-op.

# `docker ps -a`, NOT `docker ps`. A stopped container still HOLDS the name,
# and Compose still refuses to create one with that name:
#
#   Conflict. The container name "/technitium-dns" is already in use by
#   container "bfee33da...".
#
# A plain `docker ps` lists only RUNNING containers, so a legacy container that
# a previous failed attempt had already stopped was invisible to this check -
# the hook skipped the removal, and the conflict happened anyway.
#
# THE NAME FILTER ALONE ALSO MATCHES THE COMPOSE-MANAGED CONTAINER.
#
# The container this project creates has the SAME NAME as the legacy one -
# that is the whole point of the migration. So `docker ps -a --filter
# name=<name>` matches BOTH the legacy container AND the container the compose
# project created on the previous run.
#
# The consequence is that every run stopped and removed the container the
# project had just created, and then brought it straight back up. The role
# could never prove `changed=0`, and the service was being churned on every
# single run - a container restart on a live resolver, every time.
#
# The fix is to ask for a container with this name that is NOT managed by
# compose. A compose-managed container carries the label
# `com.docker.compose.project`, so filtering for a project label of `none`
# matches only the containers that have NO compose project - which is
# exactly the legacy container and nothing else.
- name: Check whether the legacy Technitium container is still present
  ansible.builtin.command:
    # `-q` prints ONLY the container IDs, with no format template at all. A
    # `--format '{{ .ID }}'` template failed to parse here - Jinja rejects
    # it - and `-q` needs no template, so there is nothing to get wrong.
    cmd: docker ps -a --filter name=technitium-dns --filter label=com.docker.compose.project=none -q
  register: technitium_dns_primary_legacy_container
  changed_when: false
  failed_when: false

- name: Check whether the legacy Technitium container is still running
  ansible.builtin.command:
    cmd: docker ps --filter name=technitium-dns -q
  register: technitium_dns_primary_legacy_running
  changed_when: false
  failed_when: false

- name: Stop the legacy Technitium container
  ansible.builtin.command:
    cmd: docker stop technitium-dns
  register: technitium_dns_primary_legacy_stop
  changed_when: technitium_dns_primary_legacy_stop.stdout | length > 0
  failed_when: false
  # Only stop it if it is actually RUNNING. `docker stop` on an already-stopped
  # container succeeds but reports changed, which would stop the role ever
  # proving `changed=0`.
  when: technitium_dns_primary_legacy_running.stdout | default('') | length > 0

- name: Remove the legacy Technitium container so its name is free
  ansible.builtin.command:
    cmd: docker rm technitium-dns
  register: technitium_dns_primary_legacy_rm
  changed_when: technitium_dns_primary_legacy_rm.stdout | length > 0
  failed_when: false
  when: technitium_dns_primary_legacy_container.stdout | default('') | length > 0

- name: Report that the legacy Technitium container was removed
  ansible.builtin.debug:
    msg: >-
      The legacy Technitium container was removed so the compose project could
      take its name. Its DATA was not touched - the configuration and zone data
      live in the bind mounts at {{ technitium_dns_primary_config_dir }} and
      {{ technitium_dns_primary_data_dir }}, which are outside the project
      directory and are not moved by this role.
      {% if technitium_dns_primary_legacy_container.stdout | default('') | length == 0 %}
      The legacy container was already gone, so there was nothing to remove -
      this run was a re-run.
      {% endif %}
