---
# The Technitium container was previously started with `docker run`. There
# was no compose file, so there is nothing to copy and nothing to move: the
# data binds are absolute paths under /opt/technitium/ and they stay exactly
# where they are.
#
# What DOES have to happen is the NAME. The legacy container is holding the
# name `technitium-dns`, and Compose refuses to create a container with a name
# that is already in use:
#
#   Error response from daemon: Conflict. The container name
#   "/technitium-dns" is already in use by container "bfee33da...".
#
# So the legacy container is stopped and REMOVED, which frees the name for the
# compose project to take. The DATA is untouched - it lives in the bind mounts,
# not in the container - so removing the container loses nothing.
#
# This hook is idempotent: if the legacy container is already gone, there is
# nothing to remove and the run is a no-op.

- name: Check whether the legacy Technitium container is still present
  ansible.builtin.command:
    cmd: docker ps --filter name=^/technitium-dns$ --format '{{{{ .ID }}}}'
  register: technitium_dns_primary_legacy_container
  changed_when: false
  failed_when: false

- name: Stop the legacy Technitium container
  ansible.builtin.command:
    cmd: docker stop technitium-dns
  register: technitium_dns_primary_legacy_stop
  changed_when: technitium_dns_primary_legacy_stop.stdout | length > 0
  failed_when: false
  when: technitium_dns_primary_legacy_container.stdout | default('') | length > 0

- name: Remove the legacy Technitium container so its name is free
  ansible.builtin.command:
    cmd: docker rm technitium-dns
  register: technitium_dns_primary_legacy_rm
  changed_when: technitium_dns_primary_legacy_rm.stdout | length > 0
  failed_when: false
  when: technitium_dns_primary_legacy_container.stdout | default('') | length > 0

- name: Report that the legacy Technitium container was removed
  ansible.builtin.debug:
    msg: >-
      The legacy Technitium container was removed so the compose project could
      take its name. Its DATA was not touched - the configuration and zone data
      live in the bind mounts at {{ technitium_dns_primary_config_dir }} and
      {{ technitium_dns_primary_data_dir }}, which are outside the project
      directory and are not moved by this role.
      {% if technitium_dns_primary_legacy_container.stdout | default('') | length == 0 %}
      The legacy container was already gone, so there was nothing to remove -
      this run was a re-run.
      {% endif %}
