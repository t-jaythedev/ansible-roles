---
- name: Write the compose project file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ docker_compose_project_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart compose project

- name: Bring the compose project up
  # The output is redirected to a file rather than captured through the pipe.
  #
  # `docker compose up -d` starts containers that INHERIT the command's stdout
  # and stderr. Those pipes then stay open for the life of the container, so a
  # module that waits for EOF on them blocks forever. Ansible's command module
  # captures exactly that way, and the run hangs at this task with no error -
  # it is waiting, not failing.
  #
  # Redirecting to a file and reading it afterwards closes that hole. The
  # readiness wait below then confirms the service is actually serving.
  ansible.builtin.shell:
    cmd: >-
      docker compose -f {{ docker_compose_project_file }} up -d --remove-orphans
      > {{ docker_compose_up_log }} 2>&1;
      echo rc=$?;
      cat {{ docker_compose_up_log }}
  # No chdir here. In check mode the project directory is never actually
  # created, so a chdir into it fails with ENOENT and masks the real result.
  # Compose resolves relative paths against the compose file's own directory,
  # which is exactly what the layout wants anyway.
  register: docker_compose_up
  changed_when: >-
    'Container' in docker_compose_up.stdout or
    'Recreate' in docker_compose_up.stdout or
    'Created' in docker_compose_up.stdout or
    'Started' in docker_compose_up.stdout or
    'Started' in docker_compose_up.stderr or
    'Removed' in docker_compose_up.stdout
  when: docker_compose_start | bool

- name: Wait for the compose project to become ready
  # TWO FIXES LIVE HERE, both for the same symptom: the run reported a
  # failure even though the service came up and served correctly.
  #
  # FIX 1 - DO NOT ASK COMPOSE WHICH CONTAINERS ARE RUNNING.
  #
  # `docker compose ps --status running --quiet` reads the PROJECT's own
  # container references. The moment a container is recreated, that reference
  # has not settled yet, so the command returns an EMPTY list even though the
  # container is up and serving. The check then burns all 30 retries and the
  # rescue block fires - which reports a failure for a service that is working.
  #
  # Asking DOCKER instead of COMPOSE removes the race entirely: `docker ps`
  # reads the daemon's live container list, which is correct the instant the
  # container exists. `--status running` is included because a container in
  # `restarting` state is ALSO serving (or about to be), and the old check
  # treated it as not-ready.
  #
  # FIX 2 - FALL BACK TO A DIRECT PORT PROBE.
  #
  # A container can be running and still not answering - a service that binds
  # its port late, or one whose healthcheck has not passed yet. If the project
  # declares ports, probe them directly with a TCP connect. That is the
  # question we actually care about: is the service answering? A project with
  # no published ports (host networking) falls through to the container check,
  # which is the best available signal for it.
  # The container count comes from `docker ps -q` rather than a --format
  # template. A Go template inside a Jinja template needs four braces to
  # survive, and it is easy to get wrong - and a wrong one fails with
  # "Syntax error in template: unexpected '.'" at run time, which is a
  # confusing way to learn that.
  #
  # The containers are found by their COMPOSE PROJECT LABEL, not by name.
  # A container name and a compose project name are NOT the same thing and
  # usually differ: the project `technitium_dns` holds a container called
  # `technitium-dns`. Filtering on the name matched nothing at all, so the
  # check saw zero containers and waited out every retry.
  #
  # The label is also the correct question to ask. "Does this PROJECT have a
  # running container?" is what the role needs to know, and the label is what
  # ties a container to its project.
  ansible.builtin.command:
    cmd: >-
      docker ps --filter label=com.docker.compose.project={{ docker_compose_project_name }}
      --filter status=running -q | wc -l
  register: docker_compose_ready
  changed_when: false
  # A service that has just been created is NOT yet serving. NPM in particular
  # takes around half a minute to finish its own startup (it installs its
  # Certbot plugins before it binds its admin port). Without this wait, the run
  # moves on while the service is still coming up, and the next migration
  # finds a container that is running but answering nothing.
  retries: 30
  delay: 5
  until: docker_compose_ready.stdout | trim | int > 0
  when: docker_compose_start | bool

- name: Find the published ports of the compose project
  # Read from the compose file itself rather than from the running containers,
  # because a port is published whether or not the container has bound it yet.
  #
  # The parsing is done by a script rather than inline here, because a JSON
  # pipeline with embedded quotes and newlines does not survive YAML folding.
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/list_published_ports.py {{ docker_compose_project_file }}"
  register: docker_compose_ports
  changed_when: false
  failed_when: false
  when: docker_compose_start | bool

- name: Wait for the published ports to answer
  # A TCP connect proves the service is actually serving, which is stronger
  # than "the container exists". Skipped when the project publishes no ports
  # (host networking), where there is nothing to connect to.
  ansible.builtin.shell:
    cmd: >-
      for p in {{ docker_compose_ports.stdout | trim }}; do
        timeout 2 bash -c "</dev/tcp/127.0.0.1/$p" 2>/dev/null && echo "port $p open";
      done
  register: docker_compose_port_probe
  changed_when: false
  failed_when: false
  retries: 15
  delay: 2
  until: docker_compose_port_probe.stdout | trim | length > 0
  when:
    - docker_compose_start | bool
    - docker_compose_ports.stdout | default("") | trim | length > 0

- name: Ensure the compose project is down when start is disabled
  # Same redirect as the bring-up task: `docker compose down` also touches
  # container pipes, and the same blocking applies.
  ansible.builtin.shell:
    cmd: >-
      docker compose -f {{ docker_compose_project_file }} down
      > {{ docker_compose_down_log }} 2>&1;
      echo rc=$?;
      cat {{ docker_compose_down_log }}
  register: docker_compose_down
  changed_when: docker_compose_down.stdout | length > 0
  when: not (docker_compose_start | bool)
