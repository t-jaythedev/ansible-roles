---
- name: Ensure the compose project directory exists
  ansible.builtin.file:
    path: "{{ docker_compose_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the project data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_compose_data_dirs }}"

# External networks are declared as external in the compose file, which means
# Compose will NOT create them - it expects them to already exist and fails
# the project start if one is missing. They are therefore created here, in the
# prepare phase, before the project comes up.
- name: Check whether each external network exists
  ansible.builtin.command:
    cmd: docker network inspect {{ item }}
  register: docker_compose_network_check
  changed_when: false
  failed_when: false
  loop: "{{ docker_compose_external_networks | default([]) }}"

- name: Create each external network that is missing
  ansible.builtin.command:
    cmd: docker network create {{ item.item }}
  register: docker_compose_network_create
  changed_when: docker_compose_network_create.stdout | length > 0
  when: item.rc != 0
  loop: "{{ docker_compose_network_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

# A service role that is moving data across provides this hook. It runs after
# the directories exist but before the compose file is written and the project
# is brought up. The hook is a list of task files, included rather than
# imported, so the caller controls the task names and can use its own vars.
# A service role that is moving data across provides this hook. It runs after
# the directories exist but before the compose file is written and the project
# is brought up.
#
# THE HOOK IS PASSED IN AS AN ABSOLUTE PATH BY THE CALLING ROLE.
#
# An `include_tasks` inside a role resolves against the role that OWNS THE
# TASK - which, here, is the BASE role. A bare `migrate_data.yml` is therefore
# looked for in roles/docker_compose/tasks/, and when it is not there the
# loader falls back to searching other roles' task directories and picks
# whichever it finds FIRST. That is how the blog role ended up running the
# nginx_proxy_manager hook: the wrong file, silently.
#
# Addressing the hook by ROLE NAME does not work either. Role defaults leak
# across `include_role` boundaries, so the base role reads the FIRST role's
# value - and including that role again makes it include itself, which is an
# infinite recursion.
#
# An ABSOLUTE path cannot be shadowed. The calling role computes it in its own
# scope, where `role_path` means that role's own directory, and passes it in.
# A SECRET IN A SERVICE DEFINITION MUST BE DECRYPTED BEFORE IT IS RENDERED.
#
# A value that came from the Ansible vault is not a string - it is an
# EncryptedString object that still carries the vault tag. When the compose
# file is rendered with to_nice_yaml, that object is serialised AS AN OBJECT
# and the literal text "!vault" plus the encrypted ciphertext end up in the
# compose file on disk:
#
#     TOKEN: !vault |
#       $ANSIBLE_VAULT;1.1;AES256
#       356564616363373737...          <- ciphertext on disk, no vault password
#
# That is a doubly bad outcome. The file is broken - Docker cannot parse it -
# AND the encrypted secret is sitting there in a readable form on disk and in
# any git history.
#
# Decrypting here, in the BASE role and before the template runs, fixes it
# once for EVERY role that has a credential in a service definition. The value
# becomes an ordinary string and the compose file carries the real secret,
# which is what a compose file is supposed to contain.
#
# The substitution is done by a small Python script rather than by Jinja
# because the thing being substituted is a Python OBJECT, not a string.
# Jinja stringification of an EncryptedString yields the "!vault" tag text
# rather than the plaintext - that is the bug this task exists to fix.
- name: Decrypt any vault-held values in the service definitions
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/decrypt_vault_values.py --services-b64 {{ docker_compose_services | to_json | b64encode }}"
  register: docker_compose_decrypt
  changed_when: false
  failed_when: docker_compose_decrypt.rc != 0
  when: docker_compose_services is defined

# THE FACT IS NOT CALLED `docker_compose_services`. THAT NAME IS DELIBERATE.
#
# `set_fact` creates a HOST-SCOPED fact that persists for the rest of the
# play. Four roles run in sequence on this host, and each one sets
# `docker_compose_services` in its own defaults. If this task wrote the
# decrypted result back to that same name, the fact set by role N would
# survive into role N+1 - and role N+1 would render role N's services into
# its own compose file.
#
# That is not theoretical. It is exactly what happened: the hawser role
# wrote the TECHNITIUM DNS service definition into
# /opt/compose/hawser/compose.yml, because the technitium role had run
# first and its fact was still in scope. The hawser compose file on disk
# contained:
#
#     services:
#       dns:
#         container_name: technitium-dns
#
# and the hawser project failed to come up with a technitium name conflict.
#
# The fact is therefore given a name that is unique to THIS role, and the
# template reads THAT name. The role's own `docker_compose_services` from
# its defaults is still what the decrypt task reads as its input.
- name: Use the decrypted service definitions
  ansible.builtin.set_fact:
    docker_compose_rendered_services: "{{ docker_compose_decrypt.stdout | from_json }}"
  when:
    - docker_compose_decrypt is defined
    - docker_compose_decrypt.stdout | default("") | trim | length > 0

- name: Run the caller's data migration hook
  ansible.builtin.include_tasks:
    file: "{{ docker_compose_migration_hook }}"
  when: docker_compose_migration_hook | default('') | length > 0
