---
- name: Ensure the compose project directory exists
  ansible.builtin.file:
    path: "{{ docker_compose_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the project data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_compose_data_dirs }}"

# External networks are declared as external in the compose file, which means
# Compose will NOT create them - it expects them to already exist and fails
# the project start if one is missing. They are therefore created here, in the
# prepare phase, before the project comes up.
- name: Check whether each external network exists
  ansible.builtin.command:
    cmd: docker network inspect {{ item }}
  register: docker_compose_network_check
  changed_when: false
  failed_when: false
  loop: "{{ docker_compose_external_networks | default([]) }}"

- name: Create each external network that is missing
  ansible.builtin.command:
    cmd: docker network create {{ item.item }}
  register: docker_compose_network_create
  changed_when: docker_compose_network_create.stdout | length > 0
  when: item.rc != 0
  loop: "{{ docker_compose_network_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

# A service role that is moving data across provides this hook. It runs after
# the directories exist but before the compose file is written and the project
# is brought up. The hook is a list of task files, included rather than
# imported, so the caller controls the task names and can use its own vars.
# A service role that is moving data across provides this hook. It runs after
# the directories exist but before the compose file is written and the project
# is brought up.
#
# THE HOOK IS PASSED IN AS AN ABSOLUTE PATH BY THE CALLING ROLE.
#
# An `include_tasks` inside a role resolves against the role that OWNS THE
# TASK - which, here, is the BASE role. A bare `migrate_data.yml` is therefore
# looked for in roles/docker_compose/tasks/, and when it is not there the
# loader falls back to searching other roles' task directories and picks
# whichever it finds FIRST. That is how the blog role ended up running the
# nginx_proxy_manager hook: the wrong file, silently.
#
# Addressing the hook by ROLE NAME does not work either. Role defaults leak
# across `include_role` boundaries, so the base role reads the FIRST role's
# value - and including that role again makes it include itself, which is an
# infinite recursion.
#
# An ABSOLUTE path cannot be shadowed. The calling role computes it in its own
# scope, where `role_path` means that role's own directory, and passes it in.
- name: Run the caller's data migration hook
  ansible.builtin.include_tasks:
    file: "{{ docker_compose_migration_hook }}"
  when: docker_compose_migration_hook | default('') | length > 0
